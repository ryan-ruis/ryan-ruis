<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Caveira em chamas verdes — fim da transmissão">
  <defs>
    <radialGradient id="aura" cx="500" cy="190" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ff9c" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00ff9c" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#00c070" stop-opacity=".75"/>
      <stop offset="1" stop-color="#0b3d2a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#eafff5"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a23"/>
      <stop offset="1" stop-color="#0a110e"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".25"/>
    </pattern>
  </defs>
  <style>
    text { font-family: Consolas,'DejaVu Sans Mono','Liberation Mono',Menlo,monospace; }
    .fl { animation: flick ease-in-out infinite alternate; }
    @keyframes flick {
      0%   { transform: scale(1, 1) skewX(0deg); }
      50%  { transform: scale(.92, 1.12) skewX(3deg); }
      100% { transform: scale(1.05, .9) skewX(-3deg); }
    }
    .wisp { transform-box: fill-box; transform-origin: center; opacity: 0; animation: wisp ease-out infinite; }
    @keyframes wisp { 0% { opacity: 0; transform: translateY(20px) scale(.6); } 30% { opacity: .8; } 100% { opacity: 0; transform: translateY(-45px) scale(.3); } }
    .em { font-size: 11px; fill: #00ff9c; opacity: 0; animation: rise linear infinite; }
    @keyframes rise {
      0%   { opacity: 0; transform: translate(0, 0); }
      15%  { opacity: .9; }
      100% { opacity: 0; transform: translate(var(--dx), -150px); }
    }
    .eye { animation: eye 2.4s ease-in-out infinite; }
    @keyframes eye { 0%,100% { opacity: .55; } 50% { opacity: 1; } 52% { opacity: .2; } 54% { opacity: 1; } }
    .aura { animation: aura 3s ease-in-out infinite; transform-origin: 500px 190px; }
    @keyframes aura { 50% { transform: scale(1.08); opacity: .7; } }
    .glitch { animation: gl 6s steps(1) infinite; }
    @keyframes gl { 0%,92%,100% { transform: none; } 93% { transform: translate(-4px,0) skewX(-12deg); } 95% { transform: translate(3px,0); } 97% { transform: translate(-1px,0) skewX(8deg); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="1000" height="380" fill="#0d1117"/>
  <circle class="aura" cx="500" cy="190" r="260" fill="url(#aura)"/>

